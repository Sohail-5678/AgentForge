name: nightly

# SPEC §4.3 / §14.5: cron 07:30 UTC (after the Gemini daily reset at midnight Pacific). `af-run nightly`
# creates nightly runs through the control-plane API, which then dispatches run-suite.yml. It is a no-op
# until the user opts in with the repository variable AF_NIGHTLY_ENABLED = 'true'.

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      agents:
        description: Comma-separated agents (datapilot, returnpilot, toy)
        required: false
        default: datapilot,returnpilot
        type: string

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    # The schedule is opt-in (AF_NIGHTLY_ENABLED); a manual dispatch always runs.
    if: github.event_name == 'workflow_dispatch' || vars.AF_NIGHTLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/sohail-5678/agentforge-runner:main
    env:
      AF_API_URL: ${{ vars.AF_API_URL }}
      AF_RUNNER_KEY: ${{ secrets.AF_RUNNER_KEY }}
      AGENTS: ${{ inputs.agents || 'datapilot,returnpilot' }}
    steps:
      - name: Mask secrets in logs
        run: |
          [ -n "$AF_RUNNER_KEY" ] && echo "::add-mask::$AF_RUNNER_KEY"
          echo "done"
      - name: Create nightly runs
        run: |
          # The input only ever reaches af-run as a validated, quoted argument.
          echo "$AGENTS" | grep -Eq '^[a-z]+(,[a-z]+)*$' || { echo "invalid agents list"; exit 1; }
          af-run nightly --agents "$AGENTS"
