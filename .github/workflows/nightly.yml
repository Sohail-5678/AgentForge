name: nightly

# SPEC §4.3 / §14.5: cron 07:30 UTC (after the Gemini daily reset at midnight Pacific). `af-run nightly`
# creates nightly runs through the control-plane API, which then dispatches run-suite.yml. It is a no-op
# until the user opts in with the repository variable AF_NIGHTLY_ENABLED = 'true'.

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    if: vars.AF_NIGHTLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/sohail-5678/agentforge-runner:main
    env:
      AF_API_URL: ${{ vars.AF_API_URL }}
      AF_RUNNER_KEY: ${{ secrets.AF_RUNNER_KEY }}
    steps:
      - name: Mask secrets in logs
        run: |
          [ -n "$AF_RUNNER_KEY" ] && echo "::add-mask::$AF_RUNNER_KEY"
          echo "done"
      - name: Create nightly runs
        run: af-run nightly
