name: build-runner-image

# Builds the runner image (SPEC §6.1) and pushes it to GHCR as a public image (free). GHCR requires a
# lowercase owner, so the owner is lowercased in a step before use. Actions pinned by SHA (SPEC §10.2).

on:
  push:
    branches: [main]
    paths:
      - "runner/**"
      - ".github/workflows/build-runner-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-runner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Lowercase owner for GHCR
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: runner
          file: runner/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/agentforge-runner:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.lc }}/agentforge-runner:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
