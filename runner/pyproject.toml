[project]
name = "agentforge-runner"
version = "0.1.0"
description = "AgentForge execution plane: runs eval suites, red-team attacks and the GEPA-lite optimizer against target agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.13",
]

[project.scripts]
af-run = "agentforge_runner.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_runner", "examples/toy_agent/toy_agent"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"agentforge_runner/demo/live.py" = ["E501"]  # data tables (synthetic live inputs and their SQL)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
